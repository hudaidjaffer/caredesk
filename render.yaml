# Render "Blueprint": tells Render how to run the CareDesk clinic app.
# Two services: the clinic app (for clinics) and the owner panel (for the owner only), sharing one Supabase database.
# Secrets (sync: false) are typed into Render's dashboard by the owner, never stored in this file.
services:
  - type: web
    name: caredesk
    runtime: node
    region: singapore              # same region as the Supabase project (ap-southeast-1)
    plan: free                     # change to "starter" (or in the dashboard) so the app never sleeps
    buildCommand: cd frontend && npm ci --include=dev && npm run build:clinic && cd ../clinic-app && npm ci --omit=dev
    startCommand: cd clinic-app && node server.js
    healthCheckPath: /api/public-settings
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: SECURE_COOKIES        # HTTPS-only, __Host- cookies
        value: "1"
      - key: TRUST_PROXY           # real visitor IPs from Render's proxy (per-person sign-in limits)
        value: all
      - key: SUPABASE_URL
        value: https://aqmzbhgrciqojbkrwcxo.supabase.co
      - key: PUBLIC_URL            # website address used in the "Confirm my email" link
        value: https://caredesk-t6nm.onrender.com
      - key: DATABASE_URL          # Supabase session pooler string, with the database password filled in
        sync: false
      - key: SUPABASE_SECRET_KEY   # sb_secret_... (photos/documents/backups go to Supabase Storage)
        sync: false
      - key: CAREDESK_KEY          # contents of clinic-app/data/secret.key on the owner's PC
        sync: false

  # The owner panel online. Extra protection in this mode (owner-panel/server.js, ONLINE): sign-in always needs
  # password + two-step code, two-step sign-in can't be turned off here, and the encryption key is never shown.
  # Secrets are copied from the clinic app service, so they are only typed into Render once.
  - type: web
    name: caredesk-owner
    runtime: node
    region: singapore
    plan: free
    buildCommand: cd frontend && npm ci --include=dev && npm run build:owner && cd ../clinic-app && npm ci --omit=dev
    startCommand: cd owner-panel && node server.js
    healthCheckPath: /api/admin/status
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: OWNER_PUBLIC
        value: "1"
      - key: SECURE_COOKIES
        value: "1"
      - key: TRUST_PROXY
        value: all
      - key: SUPABASE_URL
        value: https://aqmzbhgrciqojbkrwcxo.supabase.co
      - key: DATABASE_URL
        fromService: { type: web, name: caredesk, envVarKey: DATABASE_URL }
      - key: SUPABASE_SECRET_KEY
        fromService: { type: web, name: caredesk, envVarKey: SUPABASE_SECRET_KEY }
      - key: CAREDESK_KEY
        fromService: { type: web, name: caredesk, envVarKey: CAREDESK_KEY }
